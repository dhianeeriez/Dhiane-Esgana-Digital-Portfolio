<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Dhiane Esgana | Digital Portfolio</title>
<meta name="description" content="Digital portfolio of Dhiane Eriez Esgana, BSIT student.">
<link href="https://fonts.googleapis.com/css2?family=Italiana&family=Manrope:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
/* ==========================================================
   Dhiane Eriez Esgana — Digital Portfolio
   Edit the tokens below to restyle every page.
   ========================================================== */

:root {
  --bg: #05060a;          /* near-black page background */
  --panel: #0b0d13;       /* nav / bottom bar / panels */
  --ink: #f3efe2;         /* main text (warm white) */
  --ink-soft: #f3efe2;
  --gold: #d4a017;        /* gold accent (fills, bars, highlights) */
  --gold-deep: #f0c24a;   /* bright gold for small text on black */

  --font-display: "Italiana", "Didot", Georgia, serif;
  --font-mono: "DM Mono", ui-monospace, monospace;
  --font-body: "Manrope", system-ui, sans-serif;

  --pad: clamp(16px, 4vw, 62px);
}

*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; }

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  background-color: var(--bg);
  background-image:
    radial-gradient(60% 55% at 12% 18%, #ffffff 0%, rgba(255,255,255,0) 70%),
    radial-gradient(55% 60% at 90% 85%, #efe2b4 0%, rgba(239,226,180,0) 70%);
  background-attachment: fixed;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 1.05rem;
  line-height: 1.5;
}

a { color: inherit; }
:focus-visible { outline: 3px solid var(--gold-deep); outline-offset: 3px; }

/* ---------- Decorative background (progress bars) ---------- */
.bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; opacity: .55; }
.bar {
  position: absolute;
  height: 64px;
  border: 5px solid #ffffff;
  border-radius: 6px;
  background: rgba(255, 255, 255, .35);
}
.bar::before { content: ""; position: absolute; inset: 6px; background: #ffffff; transform: scaleX(var(--p, .2)); transform-origin: left; }
.bar span { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); font-family: var(--font-mono); font-size: 1.5rem; color: #d8c48a; font-variant-numeric: tabular-nums; }
.bar.a { left: 8%; top: 70px; width: 38%; }
.bar.b { left: 58%; top: 60%; width: 30%; height: 80px; }
.bar.c { left: 34%; top: 56%; width: 22%; height: 56px; }
.bar.d { left: 12%; top: 90%; width: 26%; }
.bg svg { position: absolute; right: 0; top: 0; width: 55%; height: 55%; }

/* ---------- Layout above background ---------- */
.site-nav, main, .pager { position: relative; z-index: 1; }
.site-nav { z-index: 3; }   /* lanyards hang from behind the nav bar */

/* ---------- Top nav ---------- */
.site-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin: 10px var(--pad) 0 clamp(8px, 4.4vw, 62px);
  padding: 4px 18px;
  min-height: 46px;
  background: var(--panel);
  border: 1px solid #0a0a0a;
  box-shadow: 0 8px 18px -10px rgba(10, 10, 10, .35);
}
.logo { display: inline-flex; align-items: center; text-decoration: none; }
.logo img { display: block; height: 34px; width: auto; transition: rotate .3s; }
.logo:hover img { rotate: -8deg; }
.menu { display: flex; flex-wrap: wrap; align-items: center; gap: 4px clamp(14px, 2.2vw, 30px); list-style: none; margin: 0; padding: 0; }
.menu > li { position: relative; }
.menu a {
  font: inherit;
  font-family: var(--font-mono);
  font-size: .9rem;
  letter-spacing: .02em;
  text-transform: uppercase;
  text-decoration: none;
  background: none;
  border: 0;
  border-radius: 999px;
  padding: 8px 14px;
  cursor: pointer;
  color: var(--ink);
  transition: background .18s, color .18s;
}
.menu > li > a:hover { background: #fbf0cc; color: var(--ink); }
.menu a[aria-current="page"] { background: var(--ink); color: #fff; }

/* ---------- Main ---------- */
main {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;   /* vertical centering */
  padding: clamp(24px, 5vw, 72px) var(--pad) 40px var(--pad);
}

/* ---------- Hero ---------- */
.hero {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 36px clamp(32px, 5vw, 90px);
  align-items: center;
  width: fit-content;
  max-width: 100%;
  margin: 0 auto;            /* horizontal centering */
}
@media (min-width: 900px) {
  .hero { grid-template-columns: minmax(260px, 440px) auto; }
}

/* profile card */
.card {
  position: relative;
  width: 100%;
  max-width: 440px;
  margin: 0;
  padding: 26px 28px 18px;
  background: var(--gold);
  border-radius: 0;
  color: #fff;
  box-shadow:
    0 2px 0 rgba(255, 255, 255, .28) inset,
    0 38px 70px -18px rgba(10, 10, 10, .45),
    0 18px 32px -10px rgba(10, 10, 10, .38),
    0 4px 10px rgba(10, 10, 10, .18);
}
/* soft floor shadow that shrinks as the card floats up */
.card::after {
  content: "";
  position: absolute;
  left: 12%; right: 12%; bottom: -34px;
  height: 22px;
  background: radial-gradient(closest-side, rgba(10, 10, 10, .35), rgba(10, 10, 10, 0));
  filter: blur(6px);
  z-index: -1;
  animation: floor 6s ease-in-out 1s infinite;
}
@keyframes floor { 0%, 100% { translate: 0 0; scale: 1; opacity: 1; } 50% { translate: 0 9px; scale: .82; opacity: .6; } }
.card .tag {
  position: absolute; top: 9px; right: 28px;
  font-family: var(--font-mono); font-size: .68rem; letter-spacing: .08em; text-transform: uppercase;
}
.card img {
  display: block;
  width: 100%;
  aspect-ratio: 326 / 360;
  object-fit: cover;
  border-radius: 0;
}
.card dl {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
  margin: 22px 0 4px; padding: 0;
}
.card dl div { border-left: 1px solid rgba(255,255,255,.7); padding-left: 6px; }
.card dt { font-family: var(--font-mono); font-size: .6rem; text-transform: uppercase; letter-spacing: .06em; opacity: .85; }
.card dd { margin: 0; font-family: var(--font-mono); font-size: .76rem; }

/* hero text */
.eyebrow {
  margin: 0 0 22px;
  font-family: var(--font-mono);
  font-size: .85rem;
  letter-spacing: .06em;
  color: var(--gold-deep);
}
.title {
  position: relative;
  margin: 0;
  font-family: var(--font-display);
  font-weight: 400;
  font-size: clamp(3.6rem, 10vw, 9rem);
  line-height: 1.04;
  letter-spacing: -.01em;
  text-shadow: 3px 4px 0 rgba(10, 10, 10, .14);
}
.title .l1, .title .l2 { display: block; }
.intro { margin: 32px 0 34px; max-width: 26ch; font-size: clamp(1.3rem, 2.3vw, 1.7rem); font-weight: 500; line-height: 1.45; }

.title { width: fit-content; max-width: 100%; }
.title .l2 { position: relative; width: fit-content; }
.gears { position: absolute; left: 100%; bottom: 4%; margin-left: 6px; width: clamp(80px, 10vw, 145px); }

/* gears turn in opposite directions, like they're meshed */
.spin { transform-box: fill-box; transform-origin: center; animation: turn 16s linear infinite; }
.spin.ccw { animation-direction: reverse; }
@keyframes turn { to { transform: rotate(360deg); } }


/* ---------- Button ---------- */
.btn {
  display: inline-block;
  padding: 17px 38px;
  background: #0a0a0a;
  border: 2px solid #0a0a0a;
  border-radius: 0;
  box-shadow: 0 6px 14px -6px rgba(10, 10, 10, .5);
  font-family: var(--font-mono);
  font-size: 1rem;
  letter-spacing: .06em;
  color: #fff;
  text-decoration: none;
  transition: translate .15s, box-shadow .15s, background .15s;
}
.btn:hover { translate: 0 -2px; box-shadow: 0 10px 18px -8px rgba(10, 10, 10, .5); background: var(--gold); border-color: var(--gold); }
.btn:active { translate: 0 1px; box-shadow: 0 2px 6px -3px rgba(10, 10, 10, .5); }

/* ---------- Inner pages ---------- */
.page { max-width: 820px; }
.page h1 { font-family: var(--font-display); font-weight: 400; font-size: clamp(2.6rem, 6vw, 4.5rem); line-height: 1; margin: 0 0 24px; }
.page h2 { font-family: var(--font-display); font-weight: 400; font-size: 2rem; margin: 40px 0 8px; scroll-margin-top: 20px; }
.page p { max-width: 60ch; }
.page .note { font-family: var(--font-mono); font-size: .8rem; color: var(--ink-soft); }

/* ---------- Bottom pager ---------- */
.pager {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  margin: 0 var(--pad) 14px clamp(8px, 4.4vw, 62px);
  padding: 8px 20px;
  min-height: 46px;
  background: var(--panel);
  border: 1px solid #0a0a0a;
  font-size: 1.1rem;
  box-shadow: 0 8px 18px -10px rgba(10, 10, 10, .35);
}
.pager a { display: flex; flex-direction: column; gap: 1px; line-height: 1.2; text-decoration: none; padding: 6px 16px; border-radius: 999px; transition: background .18s, color .18s; }
.pager a:hover { background: #fbf0cc; }
.pager .ttl { font-size: .78rem; opacity: .55; }
.pager .prev { justify-self: start; align-items: flex-start; }
.pager .home, .pager .here { justify-self: center; }
.pager .next { justify-self: end; align-items: flex-end; }

@media (max-width: 640px) {
  .site-nav { flex-wrap: wrap; padding: 8px 12px; }
}


/* ---------- Life: ambient + entrance animations ---------- */
.node { transform-box: fill-box; transform-origin: center; animation: pulse 3.2s ease-in-out infinite; }
.node.n2 { animation-delay: -1.1s; }
.node.n3 { animation-delay: -2.1s; }
@keyframes pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.5); opacity: .55; } }

.flow { stroke-dasharray: 8 12; animation: flow 3s linear infinite; }
.flow.f2 { animation-duration: 4.5s; }
@keyframes flow { to { stroke-dashoffset: -80; } }

.card { transition: transform .18s ease-out; will-change: transform; animation: card-in .9s cubic-bezier(.2,.7,.2,1) backwards, float 6s ease-in-out 1s infinite; }
@keyframes card-in { from { opacity: 0; scale: .93; } }
@keyframes float { 0%, 100% { translate: 0 0; } 50% { translate: 0 -9px; } }

.hero-text > * { animation: text-in .8s cubic-bezier(.2,.7,.2,1) backwards; }
.hero-text > :nth-child(1) { animation-delay: .25s; }
.hero-text > :nth-child(2) { animation-delay: .38s; }
.hero-text > :nth-child(3) { animation-delay: .52s; }
.hero-text > :nth-child(4) { animation-delay: .64s; }
@keyframes text-in { from { opacity: 0; translate: 0 18px; } }


@media (max-width: 640px) {
  .menu { gap: 0 2px; }
  .menu a { padding: 6px 9px; font-size: .74rem; }
  .pager { padding: 8px 12px; font-size: 1rem; }
  .pager a { white-space: nowrap; padding: 6px 8px; }
  .pager .dir { font-size: .95rem; }
  .pager .ttl { font-size: .72rem; }
  .pager .here { font-size: .95rem; text-align: center; }
}

.sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

/* ==========================================================
   About Me: one-screen personal data sheet (no scrolling on desktop).
   ID panel on the left, three lettered sections on the right.
   Sizes follow the screen height (vh) so it fits short laptop screens.
   On phones the three sections become tabs instead of scrolling.
   ========================================================== */
.about { justify-content: center; padding: clamp(12px, 2.4vh, 28px) var(--pad); }

.board {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  grid-template-areas:
    "head head"
    "p    c"
    "p    s";
  gap: clamp(8px, 1.8vh, 18px) clamp(14px, 2vw, 28px);
  width: 100%;
  max-width: 1060px;
  margin: 0 auto;
}

.board-head { grid-area: head; display: flex; align-items: baseline; justify-content: space-between; gap: 16px; }
.board-head h1 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: clamp(2rem, 6.2vh, 3.4rem); line-height: 1; text-shadow: 3px 3px 0 rgba(10, 10, 10, .14); }
.board-sub { margin: 0; font-family: var(--font-mono); font-size: .8rem; letter-spacing: .06em; color: var(--ink-soft); }

/* sections */
.sec { min-width: 0; align-self: stretch; background: #fff; border: 1px solid var(--ink); padding: clamp(10px, 1.9vh, 20px) clamp(14px, 1.6vw, 22px) clamp(6px, 1.2vh, 14px); box-shadow: 0 10px 20px -14px rgba(10, 10, 10, .4); }
.sec.p { grid-area: p; }
.sec.c { grid-area: c; }
.sec.s { grid-area: s; }
.sec-h { display: flex; align-items: center; gap: 12px; margin: 0 0 clamp(2px, .6vh, 6px); font-family: var(--font-display); font-weight: 400; font-size: clamp(1.1rem, 3vh, 1.55rem); line-height: 1.2; }
.sec-h::after { content: ""; flex: 1; border-top: 1.5px solid var(--ink); }
.sec-h .num { display: inline-grid; place-items: center; min-width: 1.9em; height: 1.9em; padding: 0 .3em; background: var(--ink); color: #fff; font-family: var(--font-mono); font-size: .7rem; letter-spacing: .04em; }

.fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 18px; margin: 0; padding: 0; }
.item { position: relative; min-width: 0; padding: clamp(4px, 1.1vh, 11px) 8px; border-bottom: 1px dashed #d9cca0; transition: background .2s, padding-left .2s; }
.item.wide { grid-column: span 2; }
.item dt { margin: 0 0 2px; font-family: var(--font-mono); font-size: clamp(.58rem, 1.4vh, .7rem); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); }
.item dd { margin: 0; font-size: clamp(.88rem, 2.15vh, 1.15rem); font-weight: 500; line-height: 1.25; overflow-wrap: anywhere; }
.item dd.empty { color: var(--ink); font-weight: 400; font-style: italic; }
.item:hover { background: #fdf6df; padding-left: 14px; }
.item:hover::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--gold); }

/* entrance + gentle float; the heading only fades in */
.reveal { animation: card-in .8s cubic-bezier(.2, .7, .2, 1) backwards; animation-delay: calc(var(--i, 0) * .09s); }
.about .sec {
  animation-name: card-in, bob;
  animation-duration: .8s, var(--bob, 6.5s);
  animation-timing-function: cubic-bezier(.2, .7, .2, 1), ease-in-out;
  animation-delay: calc(var(--i, 0) * .09s), calc(var(--i, 0) * -1.4s);
  animation-iteration-count: 1, infinite;
  animation-fill-mode: backwards, none;
  transition: transform .18s ease-out, scale .25s, box-shadow .25s;
  will-change: transform;
}
.about .sec.c { --bob: 7.4s; }
.about .sec.s { --bob: 5.8s; }
@keyframes bob { 0%, 100% { translate: 0 0; } 50% { translate: 0 -6px; } }
.about .sec:hover { scale: 1.015; box-shadow: 0 34px 46px -22px rgba(10, 10, 10, .55), 0 10px 16px -8px rgba(10, 10, 10, .3); }

/* fields cascade in, numbers pop */
.sec .item { animation: text-in .6s cubic-bezier(.2, .7, .2, 1) backwards; animation-delay: calc(.4s + var(--i, 0) * .09s + var(--k, 0) * .07s); }
.sec .item:nth-child(1) { --k: 0; } .sec .item:nth-child(2) { --k: 1; } .sec .item:nth-child(3) { --k: 2; }
.sec .item:nth-child(4) { --k: 3; } .sec .item:nth-child(5) { --k: 4; } .sec .item:nth-child(6) { --k: 5; }
.sec .item:nth-child(7) { --k: 6; } .sec .item:nth-child(8) { --k: 7; } .sec .item:nth-child(9) { --k: 8; }
.sec-h .num { animation: pop .55s cubic-bezier(.3, 1.5, .5, 1) backwards; animation-delay: calc(.3s + var(--i, 0) * .09s); }
@keyframes pop { from { scale: 0; rotate: -120deg; } }

/* tabs are only for phones */
.tabs { display: none; grid-area: tabs; }
.tabs button { flex: 1; padding: 11px 6px; background: #fff; border: 0; border-right: 1px solid var(--ink); font-family: var(--font-mono); font-size: .78rem; letter-spacing: .06em; text-transform: uppercase; color: var(--ink); cursor: pointer; }
.tabs button:last-child { border-right: 0; }
.tabs button.on { background: var(--ink); color: #fff; }

@media (max-width: 1000px) {
  .about { justify-content: flex-start; padding-top: 12px; }
  .board { grid-template-columns: minmax(0, 1fr); grid-template-areas: "tabs" "sec"; gap: 10px; }
  .board-head { display: none; }
  .tabs { display: flex; border: 1px solid var(--ink); background: #fff; }
  .sec.p, .sec.c, .sec.s { grid-area: sec; }
  .sec:not(.on) { display: none; }
  .item { padding: 5px 8px; }
  .item dd { font-size: .95rem; }
}

/* very short narrow screens: tighten the tab layout so it still fits */
@media (max-width: 1000px) and (max-height: 720px) {
  .about { padding-top: 8px; padding-bottom: 8px; }
  .board { gap: 6px; }
  .tabs button { padding: 8px 6px; }
  .sec { padding: 8px 12px 4px; }
  .sec-h { font-size: 1.05rem; }
  .item { padding: 3px 8px; }
  .item dd { font-size: .88rem; }
}

/* very narrow phones: drop the middle page title so the bottom bar never crowds */
@media (max-width: 400px) {
  .pager .here { display: none; }
}

/* ==========================================================
   Achievements: a wall of 32 picture tiles (8 x 4) that fills the screen.
   The page is locked to the screen height so nothing scrolls.
   Portrait screens switch to 4 x 8.
   ========================================================== */
body:has(.ach) { height: 100vh; height: 100dvh; }
.ach { justify-content: flex-start; min-height: 0; padding: clamp(8px, 1.6vh, 20px) clamp(10px, 1.6vw, 28px) clamp(8px, 1.4vh, 16px); }
.ach-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin: 0 0 clamp(6px, 1.2vh, 14px); }
.ach-head h1 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: clamp(1.8rem, 5.4vh, 3.2rem); line-height: 1; text-shadow: 3px 3px 0 rgba(10, 10, 10, .14); }
.ach-count { margin: 0; font-family: var(--font-mono); font-size: .85rem; letter-spacing: .06em; }

.wall {
  flex: 1; min-height: 0;
  list-style: none; margin: 0; padding: 0;
  display: grid;
  grid-template-columns: repeat(8, minmax(0, 1fr));
  grid-template-rows: repeat(4, minmax(0, 1fr));
  gap: clamp(6px, 1.4vh, 16px) clamp(6px, .9vw, 16px);
}
.tile {
  position: relative; display: flex; flex-direction: column; min-width: 0; min-height: 0;
  background: #fff; border: 1px solid var(--ink);
  box-shadow: 0 8px 16px -10px rgba(10, 10, 10, .45);
  animation: pop-in .6s cubic-bezier(.2, .7, .2, 1) backwards;
  animation-delay: calc(var(--n, 0) * 35ms);
  transition: scale .2s, box-shadow .2s;
}
@keyframes pop-in { from { opacity: 0; scale: .85; translate: 0 12px; } }
.tile figure { position: relative; flex: 1; min-height: 0; margin: 0; overflow: hidden; border-bottom: 1px solid var(--ink); background: #f0eee6; }
.tile figure img { position: absolute; inset: 0; display: block; width: 100%; height: 100%; object-fit: cover; }
.tile .num { position: absolute; left: 0; top: 0; z-index: 1; padding: 2px 6px; background: var(--ink); color: #fff; font-family: var(--font-mono); font-size: clamp(.55rem, 1.2vh, .7rem); letter-spacing: .06em; }
/* a soft shine sweeps across the wall, tile by tile */
.tile figure::after { content: ""; position: absolute; top: 0; bottom: 0; left: 0; width: 45%; background: linear-gradient(100deg, transparent, rgba(255, 255, 255, .6), transparent); transform: translateX(-160%) skewX(-18deg); animation: shine 8s ease-in-out infinite; animation-delay: calc(1.4s + var(--n, 0) * .11s); pointer-events: none; }
@keyframes shine { 0% { transform: translateX(-160%) skewX(-18deg); } 16%, 100% { transform: translateX(360%) skewX(-18deg); } }
.tile .cap { padding: clamp(3px, .8vh, 9px) clamp(5px, .55vw, 10px); }
.tile .t { margin: 0; font-size: clamp(.62rem, min(1.75vh, .95vw), .98rem); font-weight: 700; line-height: 1.15; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.tile .y { margin: 2px 0 0; font-family: var(--font-mono); font-size: clamp(.55rem, min(1.4vh, .8vw), .76rem); letter-spacing: .05em; }
.tile .empty { font-style: italic; font-weight: 400; }
.tile:hover { scale: 1.08; z-index: 3; box-shadow: 0 24px 34px -14px rgba(10, 10, 10, .55), 0 8px 12px -6px rgba(10, 10, 10, .3); }
.tile:hover .t { -webkit-line-clamp: unset; }

@media (max-aspect-ratio: 1/1), (max-width: 700px) {
  .wall { grid-template-columns: repeat(4, minmax(0, 1fr)); grid-template-rows: repeat(8, minmax(0, 1fr)); }
  .ach-head h1 { font-size: 1.5rem; }
  .ach-count { font-size: .7rem; }
}
@media (max-width: 700px) {
  .tile .y { display: none; }
  .tile .t { font-size: .56rem; }
  .tile .num { font-size: .5rem; padding: 1px 4px; }
}

/* About Me: bigger panels and text on desktop so the page is used fully */
@media (min-width: 1001px) {
  .board { max-width: 1480px; gap: clamp(10px, 2.2vh, 26px) clamp(16px, 2.4vw, 36px); }
  .board-head h1 { font-size: clamp(2.2rem, 7vh, 4.2rem); }
  .board-sub { font-size: clamp(.8rem, 1.6vh, 1rem); }
  .sec { padding: clamp(12px, 2.4vh, 30px) clamp(18px, 2vw, 34px) clamp(8px, 1.6vh, 20px); }
  .sec-h { font-size: clamp(1.2rem, min(3.6vh, 2.1vw), 2.1rem); }
  .sec-h .num { font-size: clamp(.7rem, 1.6vh, .9rem); }
  .item { padding: clamp(5px, 1.35vh, 16px) 10px; }
  .item dt { font-size: clamp(.62rem, min(1.55vh, 1vw), .85rem); }
  .item dd { font-size: clamp(.95rem, min(2.55vh, 1.6vw), 1.6rem); }
}
@media (min-width: 1001px) and (max-height: 700px) {
  .board-head h1 { font-size: 2rem; }
  .sec { padding: 8px 18px 4px; }
  .sec-h { font-size: 1.1rem; margin-bottom: 4px; }
  .item { padding: 3px 8px; }
  .item dt { font-size: .58rem; }
  .item dd { font-size: .88rem; }
  .about { padding-top: 6px; padding-bottom: 6px; }
}

@media (min-width: 1001px) and (max-height: 760px) {
  .item { padding-top: 3px; padding-bottom: 3px; }
  .sec { padding-top: 10px; }
}

/* ==========================================================
   FUTURISTIC THEME: black base, gold light, HUD brackets.
   Everything below overrides the earlier rules. Edit freely.
   ========================================================== */
:root {
  --line: rgba(212, 160, 23, .45);   /* gold hairlines */
  --glow: rgba(212, 160, 23, .35);
  --black: #05060a;
  --brackets:
    linear-gradient(var(--gold), var(--gold)), linear-gradient(var(--gold), var(--gold)),
    linear-gradient(var(--gold), var(--gold)), linear-gradient(var(--gold), var(--gold)),
    linear-gradient(var(--gold), var(--gold)), linear-gradient(var(--gold), var(--gold)),
    linear-gradient(var(--gold), var(--gold)), linear-gradient(var(--gold), var(--gold));
}
body {
  background-color: var(--bg);
  background-image:
    linear-gradient(rgba(212,160,23,.07) 1px, transparent 1px),
    linear-gradient(90deg, rgba(212,160,23,.07) 1px, transparent 1px),
    radial-gradient(60% 55% at 8% 8%, rgba(212,160,23,.14) 0%, transparent 70%),
    radial-gradient(55% 60% at 95% 95%, rgba(212,160,23,.12) 0%, transparent 70%);
  background-size: 36px 36px, 36px 36px, auto, auto;
}
/* light that follows the pointer + a slow scan beam */
body::before { content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background: radial-gradient(520px circle at var(--mx, 70%) var(--my, 25%), rgba(212,160,23,.13), transparent 62%); }
body::after { content: ""; position: fixed; left: 0; right: 0; top: 0; height: 140px; z-index: 2; pointer-events: none;
  background: linear-gradient(transparent, rgba(240,194,74,.05), transparent); animation: scan 9s linear infinite; }
@keyframes scan { from { translate: 0 -140px; } to { translate: 0 100vh; } }

.bg { opacity: .8; }
.bar { border: 2px solid var(--line); border-radius: 0; background: rgba(212,160,23,.04); }
.bar::before { background: var(--gold); opacity: .22; inset: 4px; }
.bar span { color: rgba(240,194,74,.5); }
.bg svg { stroke: var(--gold); opacity: .55; }
.bg svg [fill] { fill: var(--gold); }

/* nav + bottom bar: glass strips with a gold edge */
.site-nav, .pager { background: rgba(11,13,19,.86); backdrop-filter: blur(8px); border: 1px solid var(--line); border-top: 2px solid var(--gold);
  box-shadow: 0 0 26px -8px var(--glow), 0 10px 24px -14px #000; }
.logo img { filter: invert(1) sepia(1) saturate(4) hue-rotate(2deg) brightness(.95); }
.menu a { border-radius: 0; color: var(--ink); }
.menu a::before { content: "./"; color: var(--gold-deep); }
.menu > li > a:hover { background: rgba(212,160,23,.14); color: var(--gold-deep); box-shadow: 0 0 14px -4px var(--glow); }
.menu a[aria-current="page"] { background: var(--gold); color: var(--black); box-shadow: 0 0 18px -2px var(--glow); }
.menu a[aria-current="page"]::before { color: var(--black); }
.pager a { border-radius: 0; }
.pager a:hover { background: rgba(212,160,23,.14); }
.pager .ttl { opacity: .6; }
.pager .here { font-family: var(--font-mono); font-size: .9rem; color: var(--gold-deep); }
.pager .here::before { content: "> "; }
.pager .here::after { content: "_"; animation: caret 1s steps(1) infinite; }
@keyframes caret { 50% { opacity: 0; } }

/* profile card: glowing HUD frame */
.card { background-color: #090b10; border: 1px solid var(--line);
  background-image: var(--brackets); background-repeat: no-repeat;
  background-size: 18px 2px, 2px 18px, 18px 2px, 2px 18px, 18px 2px, 2px 18px, 18px 2px, 2px 18px;
  background-position: 0 0, 0 0, 100% 0, 100% 0, 0 100%, 0 100%, 100% 100%, 100% 100%;
  box-shadow: 0 0 40px -6px var(--glow), 0 38px 70px -18px #000, 0 0 0 1px rgba(212,160,23,.12) inset;
  animation: halo 4s ease-in-out infinite; }
@keyframes halo { 50% { box-shadow: 0 0 62px -4px rgba(212,160,23,.5), 0 38px 70px -18px #000, 0 0 0 1px rgba(212,160,23,.2) inset; } }
.card::after { background: radial-gradient(closest-side, rgba(212,160,23,.35), transparent); }
.card .tag, .card dt { color: var(--gold-deep); }
.card dl div { border-left: 2px solid var(--gold); }
.card img { outline: 1px solid var(--line); outline-offset: 5px; filter: contrast(1.04) saturate(.95); }
.card::before { content: ""; position: absolute; left: 14px; top: 10px; width: 38px; height: 8px;
  background: radial-gradient(circle at 4px 4px, var(--gold) 3.5px, transparent 4px) 0 0 / 14px 8px repeat-x; }

/* hero text */
.eyebrow { color: var(--gold-deep); }
.title { text-shadow: none; filter: drop-shadow(0 0 22px rgba(212,160,23,.28)); }
.title .l1, .title .l2 { background: linear-gradient(100deg, #ffffff 30%, #f0c24a 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent; }
.intro::before { content: "> "; font-family: var(--font-mono); color: var(--gold-deep); }
.intro::after { content: "\2588"; margin-left: 4px; color: var(--gold); animation: caret 1s steps(1) infinite; }
.btn { background: transparent; color: var(--gold-deep); border: 1px solid var(--gold); border-radius: 0; box-shadow: 0 0 22px -8px var(--glow), inset 0 0 18px -10px var(--gold); font-weight: 500; }
.btn::before { content: "$ "; opacity: .7; }
.btn:hover { background: var(--gold); color: var(--black); border-color: var(--gold); box-shadow: 0 0 30px -4px var(--glow); }

/* code-style page headings */
.board-head h1, .ach-head h1, .page h1 { text-shadow: 0 0 26px rgba(212,160,23,.35); }
.board-head h1::before, .ach-head h1::before, .page h1::before { content: "// "; font-family: var(--font-mono); font-size: .45em; color: var(--gold-deep); vertical-align: .35em; margin-right: .15em; text-shadow: none; }
.board-sub, .ach-count { color: var(--gold-deep); }
.board-sub::before, .ach-count::before { content: "/* "; }
.board-sub::after, .ach-count::after { content: " */"; }
.page .note { color: var(--gold-deep); }

/* About Me panels: dark glass with HUD corners */
.sec { background-color: rgba(11,13,19,.82); backdrop-filter: blur(6px); border: 1px solid var(--line);
  background-image: var(--brackets); background-repeat: no-repeat;
  background-size: 16px 2px, 2px 16px, 16px 2px, 2px 16px, 16px 2px, 2px 16px, 16px 2px, 2px 16px;
  background-position: 0 0, 0 0, 100% 0, 100% 0, 0 100%, 0 100%, 100% 100%, 100% 100%;
  box-shadow: 0 0 30px -10px var(--glow), 0 14px 26px -16px #000; }
.sec::after { content: ""; position: absolute; right: 18px; top: 8px; width: 34px; height: 8px;
  background: radial-gradient(circle at 4px 4px, var(--gold) 3px, transparent 3.5px) 0 0 / 13px 8px repeat-x; opacity: .8; pointer-events: none; }
.sec-h::after { border-top: 1px solid var(--line); }
.sec-h .num { background: var(--gold); color: var(--black); font-weight: 500; box-shadow: 0 0 14px -2px var(--glow); }
.item { border-bottom: 1px dashed rgba(212,160,23,.28); }
.item dt { color: var(--gold-deep); }
.item dt::before { content: "> "; }
.item:hover { background: rgba(212,160,23,.09); }
.item:hover::before { background: var(--gold); box-shadow: 0 0 10px var(--gold); }
.tabs, .tabs button { background: var(--panel); color: var(--ink); border-color: var(--line); }
.tabs button.on { background: var(--gold); color: var(--black); }

/* Achievements tiles */
.tile { background: #090b10; border: 1px solid var(--line); border-top: 2px solid var(--gold); box-shadow: 0 0 20px -10px var(--glow), 0 8px 16px -10px #000; }
.tile figure { background: #0a0b10; border-bottom: 1px solid var(--line); }
.tile .num { background: var(--gold); color: var(--black); font-weight: 500; }
.tile .y { color: var(--gold-deep); }
.tile .y::before { content: "// "; }
.tile figure::after { background: linear-gradient(100deg, transparent, rgba(240,194,74,.35), transparent); }
.tile:hover { border-color: var(--gold); box-shadow: 0 0 34px -2px rgba(212,160,23,.55), 0 24px 34px -14px #000; }
:focus-visible { outline-color: var(--gold); }

/* Achievements: zoomed-in view */
.tile { cursor: zoom-in; }
.zoom { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: clamp(10px, 3vh, 40px) clamp(10px, 3vw, 40px);
  background: rgba(3, 4, 7, .86); backdrop-filter: blur(6px); opacity: 0; transition: opacity .2s; }
.zoom[hidden] { display: none; }
.zoom.on { opacity: 1; }
.zoom-card { position: relative; width: min(1100px, 100%); max-height: 100%; display: flex; flex-direction: column;
  background: #090b10; border: 1px solid var(--gold); border-top-width: 3px;
  box-shadow: 0 0 60px -6px rgba(212,160,23,.55), 0 30px 60px -20px #000;
  scale: .88; translate: 0 18px; transition: scale .25s cubic-bezier(.2,.8,.2,1), translate .25s cubic-bezier(.2,.8,.2,1); }
.zoom.on .zoom-card { scale: 1; translate: 0 0; }
.zoom-pic { position: relative; min-height: 0; flex: 1; display: grid; place-items: center; background: #05060a; border-bottom: 1px solid var(--line); overflow: hidden; }
.zoom-pic img { display: block; width: 100%; height: auto; max-height: calc(100vh - clamp(20px, 6vh, 80px) - 120px); max-height: calc(100dvh - clamp(20px, 6vh, 80px) - 120px); object-fit: contain; }
.zoom-num { position: absolute; left: 0; top: 0; padding: 4px 10px; background: var(--gold); color: var(--black); font-family: var(--font-mono); font-size: .85rem; letter-spacing: .06em; }
.zoom-info { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 20px 16px; }
.zoom-t { margin: 0; font-size: clamp(1.1rem, 2.4vw, 1.6rem); font-weight: 700; line-height: 1.2; }
.zoom-y { margin: 4px 0 0; font-family: var(--font-mono); font-size: .9rem; color: var(--gold-deep); }
.zoom-y::before { content: "// "; }
.zoom .empty { font-style: italic; font-weight: 400; }
.zoom-nav { display: flex; gap: 8px; flex: none; }
.zoom button { font-family: var(--font-mono); cursor: pointer; background: transparent; color: var(--gold-deep); border: 1px solid var(--gold); transition: background .15s, color .15s; }
.zoom button:hover { background: var(--gold); color: var(--black); }
.zoom-nav button { width: 44px; height: 40px; font-size: 1.2rem; }
.zoom-x { position: absolute; right: 10px; top: 10px; z-index: 2; width: 38px; height: 38px; font-size: 1.5rem; line-height: 1; background: rgba(5,6,10,.8) !important; }
.zoom-x:hover { background: var(--gold) !important; }

</style>

  <script>
// Homepage: loading bars in the background count up and loop,
// and the profile card tilts toward the pointer.
(function () {
  var fine = window.matchMedia("(pointer: fine)");
  var card = document.querySelector(".card");
  var bars = Array.prototype.slice.call(document.querySelectorAll(".bar"));
  var t0 = performance.now();

  function tick(now) {
    var t = (now - t0) / 1000;
    bars.forEach(function (bar) {
      var speed = parseFloat(bar.dataset.speed) || 6;
      var start = parseFloat(bar.dataset.start) || 0;
      var p = Math.min((start + t * speed) % 116, 100);   // short pause at 100%
      bar.style.setProperty("--p", (p / 100).toFixed(4));
      var label = bar.querySelector("span");
      if (label) label.textContent = Math.floor(p) + "%";
    });
    requestAnimationFrame(tick);
  }
  if (bars.length) requestAnimationFrame(tick);

  if (card && fine.matches) {
    document.addEventListener("mousemove", function (e) {
      var rx = (e.clientY / window.innerHeight - 0.5) * -8;
      var ry = (e.clientX / window.innerWidth - 0.5) * 8;
      card.style.transform = "perspective(900px) rotateX(" + rx.toFixed(2) + "deg) rotateY(" + ry.toFixed(2) + "deg)";
    });
    document.addEventListener("mouseleave", function () { card.style.transform = ""; });
  }
})();

// About Me: each panel tilts toward the pointer while you hover over it.
(function () {
  if (!window.matchMedia("(pointer: fine)").matches) return;
  Array.prototype.slice.call(document.querySelectorAll(".about .sec")).forEach(function (panel) {
    panel.addEventListener("mousemove", function (e) {
      var r = panel.getBoundingClientRect();
      var x = (e.clientX - r.left) / r.width - 0.5;
      var y = (e.clientY - r.top) / r.height - 0.5;
      panel.style.transform = "perspective(900px) rotateX(" + (-y * 5).toFixed(2) + "deg) rotateY(" + (x * 5).toFixed(2) + "deg)";
    });
    panel.addEventListener("mouseleave", function () { panel.style.transform = ""; });
  });
})();

// About Me on phones: the three sections are tabs, so nothing needs scrolling.
(function () {
  var tabs = Array.prototype.slice.call(document.querySelectorAll(".tabs button"));
  var secs = Array.prototype.slice.call(document.querySelectorAll(".board .sec"));
  tabs.forEach(function (b) {
    b.addEventListener("click", function () {
      tabs.forEach(function (t) { var is = t === b; t.classList.toggle("on", is); t.setAttribute("aria-pressed", String(is)); });
      secs.forEach(function (s) { s.classList.toggle("on", s.dataset.tab === b.dataset.tab); });
    });
  });
})();

// Futuristic touch: a soft gold light follows the pointer.
(function () {
  if (!window.matchMedia("(pointer: fine)").matches) return;
  document.addEventListener("mousemove", function (e) {
    document.body.style.setProperty("--mx", e.clientX + "px");
    document.body.style.setProperty("--my", e.clientY + "px");
  });
})();

// Achievements: click a tile to see a big version. Esc / click outside to close, arrows to browse.
(function () {
  var tiles = Array.prototype.slice.call(document.querySelectorAll(".wall .tile"));
  if (!tiles.length) return;
  var box = document.createElement("div");
  box.className = "zoom"; box.hidden = true;
  box.setAttribute("role", "dialog"); box.setAttribute("aria-modal", "true"); box.setAttribute("aria-label", "Achievement");
  box.innerHTML =
    '<div class="zoom-card">' +
      '<button class="zoom-x" type="button" aria-label="Close">&times;</button>' +
      '<div class="zoom-pic"><img alt="" /><span class="zoom-num"></span></div>' +
      '<div class="zoom-info"><div><h2 class="zoom-t"></h2><p class="zoom-y"></p></div>' +
      '<div class="zoom-nav"><button type="button" class="zoom-prev" aria-label="Previous achievement">&larr;</button><button type="button" class="zoom-next" aria-label="Next achievement">&rarr;</button></div></div>' +
    '</div>';
  document.body.appendChild(box);
  var img = box.querySelector("img"), num = box.querySelector(".zoom-num"),
      t = box.querySelector(".zoom-t"), y = box.querySelector(".zoom-y"), cur = 0, opener = null;

  function show(i) {
    cur = (i + tiles.length) % tiles.length;
    var tile = tiles[cur], src = tile.querySelector("img"), title = tile.querySelector(".t"), year = tile.querySelector(".y");
    img.src = src.currentSrc || src.src; img.alt = src.alt;
    num.textContent = tile.querySelector(".num").textContent;
    t.textContent = title.textContent; t.className = "zoom-t" + (title.classList.contains("empty") ? " empty" : "");
    y.textContent = year.textContent; y.className = "zoom-y" + (year.classList.contains("empty") ? " empty" : "");
  }
  function open(i) {
    opener = tiles[i]; show(i); box.hidden = false;
    requestAnimationFrame(function () { box.classList.add("on"); });
    box.querySelector(".zoom-x").focus();
  }
  function close() {
    box.classList.remove("on");
    setTimeout(function () { box.hidden = true; }, 200);
    if (opener) opener.focus();
  }
  tiles.forEach(function (tile, i) {
    tile.tabIndex = 0; tile.setAttribute("role", "button");
    tile.setAttribute("aria-label", "View achievement " + (i + 1) + " larger");
    tile.addEventListener("click", function () { open(i); });
    tile.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(i); } });
  });
  box.addEventListener("click", function (e) { if (e.target === box) close(); });
  box.querySelector(".zoom-x").addEventListener("click", close);
  box.querySelector(".zoom-prev").addEventListener("click", function () { show(cur - 1); });
  box.querySelector(".zoom-next").addEventListener("click", function () { show(cur + 1); });
  document.addEventListener("keydown", function (e) {
    if (box.hidden) return;
    if (e.key === "Escape") close();
    else if (e.key === "ArrowLeft") show(cur - 1);
    else if (e.key === "ArrowRight") show(cur + 1);
  });
})();

</script>

</body></html>
