000,0 3px 10px #0007;animation:open .5s cubic-bezier(.2,.8,.2,1) backwards}\n.desk .win:first-child:not(:last-child){flex-grow:35}\n.desk .win:last-child:not(:first-child){flex-grow:65}\n.tb{flex:none;height:34px;display:flex;align-items:center;gap:8px;padding-left:12px;font-size:12px}\n.tb img{width:16px;height:16px}\n.tb span:not(.wc){flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n.wc{display:flex;align-self:stretch;margin-left:auto}\n.wc b{position:relative;width:44px}\n.wc b::before,.wc b::after{content:\"\";position:absolute;left:50%;top:50%}\n.wc .m::before{width:10px;height:1px;margin:-.5px 0 0 -5px;background:currentColor}\n.wc .r::before{width:9px;height:9px;margin:-4.5px 0 0 -4.5px;border:1px solid currentColor;border-radius:1px}\n.wc .x::before,.wc .x::after{width:13px;height:1px;margin:-.5px 0 0 -6.5px;background:currentColor;transform:rotate(45deg)}\n.wc .x::after{transform:rotate(-45deg)}\n.wc b:hover{background:rgba(0,0,0,.07)}\n.wc .x:hover{background:var(--black);color:var(--gold-hi)}\n.pane{flex:1;min-height:0;margin:0 10px 10px;display:flex;flex-direction:column;container-type:inline-size;background:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.8);border-radius:8px;overflow:hidden}\n.pane>.tb{height:30px;padding:0}\n/* home */\n.shot{flex:1;min-height:0;margin:0 10px 10px;border-radius:6px;overflow:hidden}\n.shot img{display:block;width:100%;height:100%;object-fit:cover;object-position:50% 18%}\n.name{margin:auto 0;padding:0 5cqw;font-size:11.5cqw;font-weight:800;line-height:.98;letter-spacing:-.025em;text-transform:uppercase;color:var(--black)}\n.snap{position:absolute;top:42px;right:14px;width:130px;display:grid;grid-template-columns:1fr 1fr;gap:7px;padding:8px;background:rgba(255,255,255,.92);border:1px solid rgba(0,0,0,.08);border-radius:8px;box-shadow:0 10px 24px -8px #0008}\n.snap i{display:grid;gap:2px;height:30px}\n.snap b{background:#d9d7d0;border-radius:2px;transition:background .15s}\n.snap .on b,.snap i:hover b{background:var(--gold)}\n.s2{grid-template-columns:1fr 1fr}.s3{grid-template:1fr 1fr/1fr 1fr}.s4{grid-template:1fr 1fr/1fr 1fr 1fr}\n.s3 b:first-child,.s4 b:first-child{grid-row:span 2}\n/* taskbar */\n.menu{flex:none;height:var(--tb);margin-top:10px;position:relative;display:flex;align-items:center;justify-content:center;gap:4px;background:rgba(14,12,8,.8);-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px);border-top:1px solid rgba(232,200,103,.28);color:#fff;font-size:13px}\n.menu a{position:relative;display:flex;align-items:center;gap:8px;height:38px;padding:0 14px;border-radius:6px;color:#fff;text-decoration:none;white-space:nowrap}\n.menu a:hover{background:rgba(255,255,255,.1)}\n.menu a[aria-current]{background:rgba(255,255,255,.13)}\n.menu a[aria-current]::after{content:\"\";position:absolute;left:50%;bottom:2px;width:16px;height:3px;margin-left:-8px;border-radius:2px;background:var(--gold-hi)}\n.menu img{width:20px;height:20px}\n.clock{position:absolute;right:16px;font-size:12px;line-height:1.25;text-align:right;color:#d8d3c2}\n/* inner pages */\n.scroll{flex:1;min-height:0;overflow:auto;padding:clamp(16px,3vw,28px)}\n.scroll h1{margin:0 0 4px;font-size:clamp(1.8rem,4vw,2.7rem);font-weight:400;letter-spacing:-.025em;line-height:1.05}\n.lead{margin:0 0 20px;color:#5c4d1d;font-size:.95rem}\n.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}\n.sec{background:rgba(255,255,255,.72);border:1px solid var(--line);border-radius:8px;padding:16px 18px}\n.sec.p{grid-row:span 2}\n.sec h2{display:flex;align-items:center;gap:10px;margin:0 0 8px;font-size:1.45rem}\n.sec h2::before{content:\"\";width:4px;height:1.1em;border-radius:2px;background:var(--gold)}\n.sec p{margin:0;max-width:60ch}\n.fields{display:grid;grid-template-columns:1fr 1fr;gap:0 16px;margin:0}\n.item{min-width:0;padding:8px 0;border-bottom:1px solid var(--line)}\n.item.wide{grid-column:span 2}\n.item dt{font-size:.72rem;font-weight:600;color:var(--gold-lo)}\n.item dd{margin:0;font-size:1.12rem;font-weight:500;overflow-wrap:anywhere}\n.btn{font:500 .8rem var(--m);padding:9px 16px;border:1px solid var(--black);border-radius:6px;background:var(--black);color:var(--gold-hi);cursor:pointer}\n.btn.ghost{background:#fff;color:var(--black)}\n.btn:hover{background:var(--gold);border-color:var(--gold);color:var(--black)}\n/* achievements */\n.bar{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px;margin-bottom:18px}\n.bar>div{flex:1;min-width:220px}.bar .lead{margin:0}\n.tools{display:none;gap:10px}.editing .tools{display:flex}\n.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}\n.tile{display:flex;flex-direction:column;padding:0;text-align:left;font:inherit;color:inherit;cursor:pointer;background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden;transition:transform .15s,box-shadow .15s,border-color .15s}\n.tile[aria-disabled]{cursor:default}\n.tile:hover{scale:1.05;z-index:5;border-color:var(--gold)}\n.tile span{display:block}\n.tile .im{aspect-ratio:1;display:grid;place-items:center;background:#f3efe3;color:#b5a265;font-size:1.5rem}\n.tile .im{position:relative}.tile .im img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}\n.tile .cap{padding:8px 10px;min-height:56px}\n.tile b{display:block;font-size:1.05rem;line-height:1.25}\n.tile small{font-weight:700;color:var(--gold-lo)}\n.tile.empty .cap{opacity:.45}\n.lb{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;gap:12px;padding:12px;background:rgba(5,5,4,.86);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}\n.lb.on{display:flex}\n.lb figure{margin:0;max-width:min(80vw,900px);background:var(--black);color:#fff;border:1px solid var(--gold-lo);border-radius:10px;overflow:hidden;animation:zoom .28s cubic-bezier(.2,.8,.2,1)}\n@keyframes zoom{from{opacity:0;transform:scale(.78)}}\n.lb img{display:block;max-width:100%;max-height:74vh;margin:auto}\n.lb figcaption{display:flex;justify-content:space-between;gap:14px;padding:12px 16px}\n.lb figcaption span{color:var(--gold-hi);font-weight:700}\n.lb button{flex:none;width:42px;height:42px;border-radius:50%;background:none;border:1px solid var(--gold-lo);color:var(--gold-hi);font-size:1.3rem;cursor:pointer}\n.lb button:hover{background:var(--gold);color:var(--black)}\n.lb .lx{position:absolute;top:16px;right:16px}\ndialog{width:min(92vw,380px);padding:20px;border:1px solid var(--gold-lo);border-radius:10px;background:#fff;color:var(--ink);font-family:var(--f)}\ndialog::backdrop{background:rgba(5,5,4,.7)}\ndialog h3{margin:0 0 12px}\ndialog label{display:block;font-size:.8rem;font-weight:600;color:var(--gold-lo)}\ndialog input[type=text]{width:100%;margin:4px 0 12px;padding:9px 10px;font:inherit;border:1px solid #bbb;border-radius:6px}\ndialog img{display:block;max-width:100%;max-height:160px;margin:0 auto 12px;border-radius:6px}\ndialog .row{display:flex;gap:8px;flex-wrap:wrap}\n@media(min-width:901px){body{height:100vh;height:100dvh}.desk{min-height:0}}\n@media(max-width:900px){\n.desk{flex-direction:column}\n.desk .win:first-child:not(:last-child),.desk .win:last-child:not(:first-child){flex:none}\n.shot{flex:none;height:min(110vw,520px)}\n.name{padding:12cqw 5cqw}\n.cols{grid-template-columns:1fr}.sec.p{grid-row:auto}\n.menu{justify-content:flex-start;overflow-x:auto}.clock{display:none}}\n\n/* ---- flow, float, tilt, shadows ---- */\nbody{font-size:17px}\n.tb,.lead,.item dt,.clock,.tile small,.lb figcaption span,dialog label,.menu{font-family:var(--m)}\n.menu{margin:10px 10px 0;border:1px solid rgba(232,200,103,.28);border-radius:14px}\n.menu a{font-size:.8rem}\n.pager{flex:none;margin:0 10px 10px;min-height:58px;padding:6px 12px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;background:rgba(14,12,8,.8);-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px);border:1px solid rgba(232,200,103,.28);border-radius:14px;color:#fff}\n.pager a{display:flex;align-items:center;gap:12px;padding:4px 8px;border-radius:999px;color:#fff;text-decoration:none;font-size:1.1rem;line-height:1.1}\n.pager .prev{justify-self:start}.pager .next{justify-self:end;text-align:right}\n.pager small{display:block;margin-bottom:2px;font:.66rem var(--m);color:var(--gold-hi)}\n.pager i{display:grid;place-items:center;width:38px;height:38px;border:1px solid var(--gold);border-radius:50%;font-style:normal;color:var(--gold-hi);transition:background .25s,color .25s,translate .3s cubic-bezier(.3,1.6,.5,1)}\n.pager a:hover i{background:var(--gold);color:var(--black)}\n.pager .prev:hover i{translate:-5px 0}.pager .next:hover i{translate:5px 0}\n.pager .here{padding:0 12px;font-size:1.35rem}\n.win,.sec,.tile,.shot,.snap,.btn,.menu a,.pager a{transition:transform .22s ease-out,scale .25s,box-shadow .3s,background .2s,color .2s,border-color .2s}\n.win{transition:flex-grow .8s cubic-bezier(.3,1.1,.5,1),transform .22s ease-out,box-shadow .3s}\n@keyframes float2{50%{translate:0 -3px}}\n@keyframes drift{to{rotate:6deg;scale:1.1}}\n@keyframes sway{50%{translate:3vmax -2vmax}}\n.win{animation:open .8s cubic-bezier(.2,.9,.3,1.05) backwards;animation-delay:calc(var(--i,0)*.14s)}\n.desk:not(.page) .win:first-child{animation-name:inL}\n.desk:not(.page) .win:last-child{animation-name:inR}\n.win:nth-child(2){--i:1}\n.sec,.snap{animation:rise .8s cubic-bezier(.25,1.2,.5,1) backwards,float 5.5s ease-in-out infinite;animation-delay:calc(var(--i,0)*.1s + .35s),calc(var(--i,0)*-.9s)}\n.sec,.tile{position:relative}\n.sec:nth-child(2){--i:1}.sec:nth-child(3){--i:2}\n.wall{translate:calc(var(--px,0)*-22px) calc(var(--py,0)*-14px);transition:translate .6s ease-out}\n.wall .a{animation:drift 16s ease-in-out infinite alternate}\n.wall .b{animation:sway 14s ease-in-out infinite}\n.wall .c{animation:sway 18s ease-in-out -6s infinite reverse}\n.sec,.tile{box-shadow:0 16px 30px -16px rgba(0,0,0,.55),0 3px 8px rgba(0,0,0,.12)}\n.sec:hover,.tile:hover{box-shadow:0 44px 72px -24px #000,0 8px 18px rgba(0,0,0,.3)}\n.shot{box-shadow:0 14px 28px -10px rgba(0,0,0,.6)}\n.btn{box-shadow:0 8px 16px -8px #000a}\n.menu,.pager{box-shadow:0 14px 30px -12px #000}\n.name{text-shadow:3px 4px 0 rgba(200,162,74,.55),0 14px 30px rgba(0,0,0,.22)}\n.snap i{cursor:pointer}\n:is(.sec,.tile)::after{content:\"\";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .3s;background:radial-gradient(circle at var(--mx,50%) var(--my,50%),rgba(232,200,103,.3),transparent 45%)}\n:is(.sec,.tile):hover::after{opacity:1}\n.item{transition:padding-left .25s,background .25s}\n.item:hover{background:rgba(232,200,103,.2)}\n@media(max-width:600px){.pager a span{display:none}}\n\n/* bolder name */\n.name{-webkit-text-stroke:.03em currentColor;paint-order:stroke fill}\n/* livelier tiles */\n@keyframes shine{0%,65%{translate:-130% 0}100%{translate:130% 0}}\n@keyframes beat{50%{scale:1.1}}\n.tile{animation:rise .7s cubic-bezier(.25,1.2,.5,1) backwards,tilefloat 6s ease-in-out infinite;animation-delay:calc(var(--i,0)*.035s + .25s),calc(var(--i,0)*-.4s)}\n.sec{overflow:hidden}\n:is(.tile,.sec)::before{content:\"\";position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.6) 50%,transparent 60%);animation:shine 6s ease-in-out infinite;animation-delay:calc(var(--i,0)*.2s)}\n.snap i{animation:beat 3.2s ease-in-out infinite}\n.snap i:nth-child(2){animation-delay:-.8s}.snap i:nth-child(3){animation-delay:-1.6s}.snap i:nth-child(4){animation-delay:-2.4s}\n/* achievements: all 32 tiles on one screen, no scrolling */\nbody:has(.desk.fit){height:100vh;height:100dvh;overflow:hidden}\n.fit .scroll{display:flex;flex-direction:column;overflow:hidden;padding:12px 16px}\n.fit .bar{flex:none;align-items:center;margin-bottom:10px}\n.fit .bar>div{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}\n.fit h1{font-size:clamp(1.5rem,3.6vh,2.1rem)}\n.fit .grid{flex:1;min-height:0;grid-template-columns:repeat(8,minmax(0,1fr));grid-template-rows:repeat(4,minmax(0,1fr));gap:clamp(8px,1.6vh,14px)}\n.fit .tile{min-height:0}\n.fit .tile .im{flex:1;min-height:0;aspect-ratio:auto}\n.fit .tile .cap{flex:none;min-height:0;padding:4px 8px}\n.fit .tile b{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:clamp(.72rem,1.9vh,1rem)}\n.fit .tile small{font-size:.66rem}\n@media(max-width:700px){.fit .grid{grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(8,minmax(0,1fr));gap:6px}.fit .tile .cap{display:none}.fit .bar>div .lead{display:none}}\n\n/* extra life */\n@keyframes open{from{opacity:0;transform:translateY(60px) scale(.9)}}\n@keyframes inL{from{opacity:0;transform:translateX(-70px) scale(.94)}}\n@keyframes inR{from{opacity:0;transform:translateX(70px) scale(.94)}}\n@keyframes rise{from{opacity:0;transform:scale(.7)}}\n@keyframes float{0%,100%{translate:0 0}50%{translate:0 -5px}}\n@keyframes tilefloat{0%,100%{translate:0 0;rotate:-.4deg}50%{translate:0 -4px;rotate:.4deg}}\n@keyframes kb{to{scale:1.14}}\n@keyframes sweep{from{background-position:-50% 0}to{background-position:150% 0}}\n@keyframes spark{0%{translate:0 0;opacity:0}12%{opacity:1}100%{translate:var(--dx,30px) -105vh;opacity:0}}\n@keyframes rip{to{scale:16;opacity:0}}\n.shot img{scale:1.06;translate:calc(var(--px,0)*-6px) calc(var(--py,0)*-4px);transition:translate .5s ease-out;animation:kb 14s ease-in-out infinite alternate}\n.menu,.pager{position:relative}\n.menu::after,.pager::after{content:\"\";position:absolute;left:12px;right:12px;bottom:-1px;height:2px;background:linear-gradient(90deg,transparent,var(--gold-hi),transparent) -50% 0/40% 100% no-repeat;animation:sweep 4s linear infinite}\n.pager::after{bottom:auto;top:-1px;animation-direction:reverse}\n.sp{position:absolute;bottom:-12px;border-radius:50%;background:radial-gradient(#fff6c8,#e8c867 60%,transparent);box-shadow:0 0 10px 2px rgba(232,200,103,.7);animation:spark linear infinite}\n.orb{position:fixed;lef und:conic-gradient(from 160deg,#fff3c4,#e8c867,#8a6a1c,#0a0a09,#c8a24a,#fff8e0,#fff3c4)}\n.wall .b{width:40vmax;height:40vmax;left:-8vmax;top:20%;background:radial-gradient(#e8c86766,transparent 65%)}\n.wall .c{width:46vmax;height:26vmax;right:-10vmax;top:-8vmax;background:radial-gradient(#ffffff3d,transparent 65%)}\n/* desktop + windows */\n.desk{flex:1;display:flex;gap:10px;padding:10px;min-height:0}\n.desk.page{width:100%;max-width:1200px;margin:0 auto}\n.win{flex:1 1 0;min-width:0;min-height:0;position:relative;display:flex;flex-direction:column;background:rgba(255,255,255,.64);-webkit-backdrop-filter:blur(30px) saturate(1.5);backdrop-filter:blur(30px) saturate(1.5);border:1px solid rgba(255,255,255,.75);border-radius:10px;box-shadow:0 30px 70px -24px #000,0 3px 10px #0007;animation:open .5s cubic-bezier(.2,.8,.2,1) backwards}\n.desk .win:first-child:not(:last-child){flex-grow:35}\n.desk .win:last-child:not(:first-child){flex-grow:65}\n.tb{flex:none;height:34px;display:flex;align-items:center;gap:8px;padding-left:12px;font-size:12px}\n.tb img{width:16px;height:16px}\n.tb span:not(.wc){flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n.wc{display:flex;align-self:stretch;margin-left:auto}\n.wc b{position:relative;width:44px}\n.wc b::before,.wc b::after{content:\"\";position:absolute;left:50%;top:50%}\n.wc .m::before{width:10px;height:1px;margin:-.5px 0 0 -5px;background:currentColor}\n.wc .r::before{width:9px;height:9px;margin:-4.5px 0 0 -4.5px;border:1px solid currentColor;border-radius:1px}\n.wc .x::before,.wc .x::after{width:13px;height:1px;margin:-.5px 0 0 -6.5px;background:currentColor;transform:rotate(45deg)}\n.wc .x::after{transform:rotate(-45deg)}\n.wc b:hover{background:rgba(0,0,0,.07)}\n.wc .x:hover{background:var(--black);color:var(--gold-hi)}\n.pane{flex:1;min-height:0;margin:0 10px 10px;display:flex;flex-direction:column;container-type:inline-size;background:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.8);border-radius:8px n(110vw,520px)}\n.name{padding:12cqw 5cqw}\n.cols{grid-template-columns:1fr}.sec.p{grid-row:auto}\n.menu{justify-content:flex-start;overflow-x:auto}.clock{display:none}}\n\n/* ---- flow, float, tilt, shadows ---- */\nbody{font-size:17px}\n.tb,.lead,.item dt,.clock,.tile small,.lb figcaption span,dialog label,.menu{font-family:var(--m)}\n.menu{margin:10px 10px 0;border:1px solid rgba(232,200,103,.28);border-radius:14px}\n.menu a{font-size:.8rem}\n.pager{flex:none;margin:0 10px 10px;min-height:58px;padding:6px 12px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;background:rgba(14,12,8,.8);-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px);border:1px solid rgba(232,200,103,.28);border-radius:14px;color:#fff}\n.pager a{display:flex;align-items:center;gap:12px;padding:4px 8px;border-radius:999px;color:#fff;text-decoration:none;font-size:1.1rem;line-height:1.1}\n.pager .prev{justify-self:start}.pager .next{justify-self:end;text-align:right}\n.pager small{display:block;margin-bottom:2px;font:.66rem var(--m);color:var(--gold-hi)}\n.pager i{display:grid;place-items:center;width:38px;height:38px;border:1px solid var(--gold);border-radius:50%;font-style:normal;color:var(--gold-hi);transition:background .25s,color .25s,translate .3s cubic-bezier(.3,1.6,.5,1)}\n.pager a:hover i{background:var(--gold);color:var(--black)}\n.pager .prev:hover i{translate:-5px 0}.pager .next:hover i{translate:5px 0}\n.pager .here{padding:0 12px;font-size:1.35rem}\n.win,.sec,.tile,.shot,.snap,.btn,.menu a,.pager a{transition:transform .22s ease-out,scale .25s,box-shadow .3s,background .2s,color .2s,border-color .2s}\n.win{transition:flex-grow .8s cubic-bezier(.3,1.1,.5,1),transform .22s ease-out,box-shadow .3s}\n@keyframes float2{50%{translate:0 -3px}}\n@keyframes drift{to{rotate:6deg;scale:1.1}}\n@keyframes sway{50%{translate:3vmax -2vmax}}\n.win{animation:open .8s cubic-bezier(.2,.9,.3,1.05) backwards;animation-delay:calc(var(--i,0)*.14s)}\n.desk:not(.page) .win:first-child{animation-name:inL}\n.desk:not(.page) .win:last-child{animation-name:inR}\n.win:nth-child(2){--i:1}\n.sec,.snap{animation:rise .8s cubic-bezier(.25,1.2,.5,1) backwards,float 5.5s ease-in-out infinite;animation-delay:calc(var(--i,0)*.1s + .35s),calc(var(--i,0)*-.9s)}\n.sec,.tile{position:relative}\n.sec:nth-child(2){--i:1}.sec:nth-child(3){--i:2}\n.wall{translate:calc(var(--px,0)*-22px) calc(var(--py,0)*-14px);transition:translate .6s ease-out}\n.wall .a{animation:drift 16s ease-in-out infinite alternate}\n.wall .b{animation:sway 14s ease-in-out infinite}\n.wall .c{animation:sway 18s ease-in-out -6s infinite reverse}\n.sec,.tile{box-shadow:0 16px 30px -16px rgba(0,0,0,.55),0 3px 8px rgba(0,0,0,.12)}\n.sec:hover,.tile:hover{box-shadow:0 44px 72px -24px #000,0 8px 18px rgba(0,0,0,.3)}\n.shot{box-shadow:0 14px 28px -10px rgba(0,0,0,.6)}\n.btn{box-shadow:0 8px 16px -8px #000a}\n.menu,.pager{box-shadow:0 14px 30px -12px #000}\n.name{text-shadow:3px 4px 0 rgba(200,162,74,.55),0 14px 30px rgba(0,0,0,.22)}\n.snap i{cursor:pointer}\n:is(.sec,.tile)::after{content:\"\";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .3s;background:radial-gradient(circle at var(--mx,50%) var(--my,50%),rgba(232,200,103,.3),transparent 45%)}\n:is(.sec,.tile):hover::after{opacity:1}\n.item{transition:padding-left .25s,background .25s}\n.item:hover{background:rgba(232,200,103,.2)}\n@media(max-width:600px){.pager a span{display:none}}\n\n/* bolder name */\n.name{-webkit-text-stroke:.03em currentColor;paint-order:stroke fill}\n/* livelier tiles */\n@keyframes shine{0%,65%{translate:-130% 0}100%{translate:130% 0}}\n@keyframes beat{50%{scale:1.1}}\n.tile{animation:rise .7s cubic-bezier(.25,1.2,.5,1) backwards,tilefloat 6s ease-in-out infinite;animation-delay:calc(var(--i,0)*.035s + .25s),calc(var(--i,0)*-.4s)}\n.sec{overflow:hidden}\n:is(.tile,.sec)::before{content:\"\";position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-grad radient(110% 80% at 50% 0,#211d12,#070706 62%)}\n.wall i{position:absolute;border-radius:50%;filter:blur(36px)}\n.wall .a{width:76vmax;height:44vmax;left:50%;bottom:-22vmax;margin-left:-38vmax;transform:rotate(-12deg);background:conic-gradient(from 160deg,#fff3c4,#e8c867,#8a6a1c,#0a0a09,#c8a24a,#fff8e0,#fff3c4)}\n.wall .b{width:40vmax;height:40vmax;left:-8vmax;top:20%;background:radial-gradient(#e8c86766,transparent 65%)}\n.wall .c{width:46vmax;height:26vmax;right:-10vmax;top:-8vmax;background:radial-gradient(#ffffff3d,transparent 65%)}\n/* desktop + windows */\n.desk{flex:1;display:flex;gap:10px;padding:10px;min-height:0}\n.desk.page{width:100%;max-width:1200px;margin:0 auto}\n.win{flex:1 1 0;min-width:0;min-height:0;position:relative;display:flex;flex-direction:column;background:rgba(255,255,255,.64);-webkit-backdrop-filter:blur(30px) saturate(1.5);backdrop-filter:blur(30px) saturate(1.5);border:1px solid rgba(255,255,255,.75);border-radius:10px;box-shadow:0 30px 70px -24px #000,0 3px 10px #0007;animation:open .5s cubic-bezier(.2,.8,.2,1) backwards}\n.desk .win:first-child:not(:last-child){flex-grow:35}\n.desk .win:last-child:not(:first-child){flex-grow:65}\n.tb{flex:none;height:34px;display:flex;align-items:center;gap:8px;padding-left:12px;font-size:12px}\n.tb img{width:16px;height:16px}\n.tb span:not(.wc){flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n.wc{display:flex;align-self:stretch;margin-left:auto}\n.wc b{position:relative;width:44px}\n.wc b::before,.wc b::after{content:\"\";position:absolute;left:50%;top:50%}\n.wc .m::before{width:10px;height:1px;margin:-.5px 0 0 -5px;background:currentColor}\n.wc .r::before{width:9px;height:9px;margin:-4.5px 0 0 -4.5px;border:1px solid currentColor;border-radius:1px}\n.wc .x::before,.wc .x::after{width:13px;height:1px;margin:-.5px 0 0 -6.5px;background:currentColor;transform:rotate(45deg)}\n.wc .x::after{transform:rotate(-45deg)}\n.wc b:hover{background:rgba(0,0,0,.07)}\n.wc .x:hover{background:var(--black);color:var(--gold-hi)}\n.pane{flex:1;min-height:0;margin:0 10px 10px;display:flex;flex-direction:column;container-type:inline-size;background:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.8);border-radius:8px;overflow:hidden}\n.pane>.tb{height:30px;padding:0}\n/* home */\n.shot{flex:1;min-height:0;margin:0 10px 10px;border-radius:6px;overflow:hidden}\n.shot img{display:block;width:100%;height:100%;object-fit:cover;object-position:50% 18%}\n.name{margin:auto 0;padding:0 5cqw;font-size:11.5cqw;font-weight:800;line-height:.98;letter-spacing:-.025em;text-transform:uppercase;color:var(--black)}\n.snap{position:absolute;top:42px;right:14px;width:130px;display:grid;grid-template-columns:1fr 1fr;gap:7px;padding:8px;background:rgba(255,255,255,.92);border:1px solid rgba(0,0,0,.08);border-radius:8px;box-shadow:0 10px 24px -8px #0008}\n.snap i{display:grid;gap:2px;height:30px}\n.snap b{background:#d9d7d0;border-radius:2px;transition:background .15s}\n.snap .on b,.snap i:hover b{background:var(--gold)}\n.s2{grid-template-columns:1fr 1fr}.s3{grid-template:1fr 1fr/1fr 1fr}.s4{grid-template:1fr 1fr/1fr 1fr 1fr}\n.s3 b:first-child,.s4 b:first-child{grid-row:span 2}\n/* taskbar */\n.menu{flex:none;height:var(--tb);margin-top:10px;position:relative;display:flex;align-items:center;justify-content:center;gap:4px;background:rgba(14,12,8,.8);-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px);border-top:1px solid rgba(232,200,103,.28);color:#fff;font-size:13px}\n.menu a{position:relative;display:flex;align-items:center;gap:8px;height:38px;padding:0 14px;border-radius:6px;color:#fff;text-decoration:none;white-space:nowrap}\n.menu a:hover{background:rgba(255,255,255,.1)}\n.menu a[aria-current]{background:rgba(255,255,255,.13)}\n.menu a[aria-current]::after{content:\"\";position:absolute;left:50%;bottom:2px;width:16px;height:3px;margin-left:-8px;border-radius:2px;background:var(--gold-hi)}\n.menu img{width:20px;height:20px}\n.clock{position:absolute;right:16px;font-size:12px;line-height:1.25;text-align:right;color:#d8d3c2}\n/* inner pages */\n.scroll{flex:1;min-height:0;overflow:auto;padding:clamp(16px,3vw,28px)}\n.scroll h1{margin:0 0 4px;font-size:clamp(1.8rem,4vw,2.7rem);font-weight:400;letter-spacing:-.025em;line-height:1.05}\n.lead{margin:0 0 20px;color:#5c4d1d;font-size:.95rem}\n.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}\n.sec{background:rgba(255,255,255,.72);border:1px solid var(--line);border-radius:8px;padding:16px 18px}\n.sec.p{grid-row:span 2}\n.sec h2{display:flex;align-items:center;gap:10px;margin:0 0 8px;font-size:1.45rem}\n.sec h2::before{content:\"\";width:4px;height:1.1em;border-radius:2px;background:var(--gold)}\n.sec p{margin:0;max-width:60ch}\n.fields{display:grid;grid-template-columns:1fr 1fr;gap:0 16px;margin:0}\n.item{min-width:0;padding:8px 0;border-bottom:1px solid var(--line)}\n.item.wide{grid-column:span 2}\n.item dt{font-size:.72rem;font-weight:600;color:var(--gold-lo)}\n.item dd{margin:0;font-size:1.12rem;font-weight:500;overflow-wrap:anywhere}\n.btn{font:500 .8rem var(--m);padding:9px 16px;border:1px solid var(--black);border-radius:6px;background:var(--black);color:var(--gold-hi);cursor:pointer}\n.btn.ghost{background:#fff;color:var(--black)}\n.btn:hover{background:var(--gold);border-color:var(--gold);color:var(--black)}\n/* achievements */\n.bar{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px;margin-bottom:18px}\n.bar>div{flex:1;min-width:220px}.bar .lead{margin:0}\n.tools{display:none;gap:10px}.editing .tools{display:flex}\n.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}\n.tile{display:flex;flex-direction:column;padding:0;text-align:left;font:inherit;color:inherit;cursor:pointer;background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden;transition:transform .15s,box-shadow .15s,border-color .15s}\n\n.tile:hover{scale:1.05;z-index:5;border-color:var(--gold)}\n.tile span{display:block}\n.tile .im{aspect-ratio:1;display:grid;place-items:center;background:#f3efe3;color:#b5a265;font-size:1.5rem}\n.tile .im{position:relative}.tile .im img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}\n.tile .cap{padding:8px 10px;min-height:56px}\n.tile b{display:block;font-size:1.05rem;line-height:1.25}\n.tile small{font-weight:700;color:var(--gold-lo)}\n.tile.empty .cap{opacity:.45}\n.lb{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;gap:12px;padding:12px;background:rgba(5,5,4,.86);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}\n.lb.on{display:flex}\n.lb figure{margin:0;max-width:min(80vw,900px);background:var(--black);color:#fff;border:1px solid var(--gold-lo);border-radius:10px;overflow:hidden;animation:zoom .28s cubic-bezier(.2,.8,.2,1)}\n@keyframes zoom{from{opacity:0;transform:scale(.78)}}\n.lb img{display:block;max-width:100%;max-height:74vh;margin:auto}\n.lb figcaption{display:flex;justify-content:space-between;gap:14px;padding:12px 16px}\n.lb figcaption span{color:var(--gold-hi);font-weight:700}\n.lb button{flex:none;width:42px;height:42px;border-radius:50%;background:none;border:1px solid var(--gold-lo);color:var(--gold-hi);font-size:1.3rem;cursor:pointer}\n.lb button:hover{background:var(--gold);color:var(--black)}\n.lb .lx{position:absolute;top:16px;right:16px}\ndialog{width:min(92vw,380px);padding:20px;border:1px solid var(--gold-lo);border-radius:10px;background:#fff;color:var(--ink);font-family:var(--f)}\ndialog::backdrop{background:rgba(5,5,4,.7)}\ndialog h3{margin:0 0 12px}\ndialog label{display:block;font-size:.8rem;font-weight:600;color:var(--gold-lo)}\ndialog input[type=text]{width:100%;margin:4px 0 12px;padding:9px 10px;font:inherit;border:1px solid #bbb;border-radius:6px}\ndialog img{display:block;max-width:100%;max-height:160px;margin:0 auto 12px;border-radius:6px}\ndialog .row{display:flex;gap:8px;flex-wrap:wrap}\n@media(min-width:901px){body{height:100vh;height:100dvh}.desk{min-height:0}}\n@media(max-width:900px){\n.desk{flex-direction:column}\n.desk .win:first-child:not(:last-child),.desk .win:last-child:not(:first-child){flex:none}\n.shot{flex:none;height:min(110vw,520px)}\n.name{padding:12cqw 5cqw}\n.cols{grid-template-columns:1fr}.sec.p{grid-row:auto}\n.menu{justify-content:flex-start;overflow-x:auto}.clock{display:none}}\n\n/* ---- flow, float, tilt, shadows ---- */\nbody{font-size:17px}\n.tb,.lead,.item dt,.clock,.tile small,.lb figcaption span,dialog label,.menu{font-family:var(--m)}\n.menu{margin:10px 10px 0;border:1px solid rgba(232,200,103,.28);border-radius:14px}\n.menu a{font-size:.8rem}\n.pager{flex:none;margin:0 10px 10px;min-height:58px;padding:6px 12px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;background:rgba(14,12,8,.8);-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px);border:1px solid rgba(232,200,103,.28);border-radius:14px;color:#fff}\n.pager a{display:flex;align-items:center;gap:12px;padding:4px 8px;border-radius:999px;color:#fff;text-decoration:none;font-size:1.1rem;line-height:1.1}\n.pager .prev{justify-self:start}.pager .next{justify-self:end;text-align:right}\n.pager small{display:block;margin-bottom:2px;font:.66rem var(--m);color:var(--gold-hi)}\n.pager i{display:grid;place-items:center;width:38px;height:38px;border:1px solid var(--gold);border-radius:50%;font-style:normal;color:var(--gold-hi);transition:background .25s,color .25s,translate .3s cubic-bezier(.3,1.6,.5,1)}\n.pager a:hover i{background:var(--gold);color:var(--black)}\n.pager .prev:hover i{translate:-5px 0}.pager .next:hover i{translate:5px 0}\n.pager .here{padding:0 12px;font-size:1.35rem}\n.win,.sec,.tile,.shot,.snap,.btn,.menu a,.pager a{transition:transform .22s ease-out,scale .25s,box-shadow .3s,background .2s,color .2s,border-color .2s}\n.win{transition:flex-grow .8s cubic-bezier(.3,1.1,.5,1),transform .22s ease-out,box-shadow .3s}\n@keyframes float2{50%{translate:0 -3px}}\n@keyframes drift{to{rotate:6deg 55,.75);border-radius:10px;box-shadow:0 30px 70px -24px #000,0 3px 10px #0007;animation:open .5s cubic-bezier(.2,.8,.2,1) backwards}\n.desk .win:first-child:not(:last-child){flex-grow:35}\n.desk .win:last-child:not(:first-child){flex-grow:65}\n.tb{flex:none;height:34px;display:flex;align-items:center;gap:8px;padding-left:12px;font-size:12px}\n.tb img{width:16px;height:16px}\n.tb span:not(.wc){flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n.wc{display:flex;align-self:stretch;margin-left:auto}\n.wc b{position:relative;width:44px}\n.wc b::before,.wc b::after{content:\"\";position:absolute;left:50%;top:50%}\n.wc .m::before{width:10px;height:1px;margin:-.5px 0 0 -5px;background:currentColor}\n.wc .r::before{width:9px;height:9px;margin:-4.5px 0 0 -4.5px;border:1px solid currentColor;border-radius:1px}\n.wc .x::before,.wc .x::after{width:13px;height:1px;margin:-.5px 0 0 -6.5px;background:currentColor;transform:rotate(45deg)}\n.wc .x::after{transform:rotate(-45deg)}\n.wc b:hover{background:rgba(0,0,0,.07)}\n.wc .x:hover{background:var(--black);color:var(--gold-hi)}\n.pane{flex:1;min-height:0;margin:0 10px 10px;display:flex;flex-direction:column;container-type:inline-size;background:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.8);border-radius:8px;overflow:hidden}\n.pane>.tb{height:30px;padding:0}\n/* home */\n.shot{flex:1;min-height:0;margin:0 10px 10px;border-radius:6px;overflow:hidden}\n.shot img{display:block;width:100%;height:100%;object-fit:cover;object-position:50% 18%}\n.name{margin:auto 0;padding:0 5cqw;font-size:11.5cqw;font-weight:800;line-height:.98;letter-spacing:-.025em;text-transform:uppercase;color:var(--black)}\n.snap{position:absolute;top:42px;right:14px;width:130px;display:grid;grid-template-columns:1fr 1fr;gap:7px;padding:8px;background:rgba(255,255,255,.92);border:1px solid rgba(0,0,0,.08);border-radius:8px;box-shadow:0 10px 24px -8px #0008}\n.snap i{display:grid;gap:2px;height:30px}\n.snap b{background:#d9d7d0;border-radius:2px;transition:background .15s}\n.snap .on b,.snap i:hover b{background:var(--gold)}\n.s2{grid-template-columns:1fr 1fr}.s3{grid-template:1fr 1fr/1fr 1fr}.s4{grid-template:1fr 1fr/1fr 1fr 1fr}\n.s3 b:first-child,.s4 b:first-child{grid-row:span 2}\n/* taskbar */\n.menu{flex:none;height:var(--tb);margin-top:10px;position:relative;display:flex;align-items:center;justify-content:center;gap:4px;background:rgba(14,12,8,.8);-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px);border-top:1px solid rgba(232,200,103,.28);color:#fff;font-size:13px}\n.menu a{position:relative;display:flex;align-items:center;gap:8px;height:38px;padding:0 14px;border-radius:6px;color:#fff;text-decoration:none;white-space:nowrap}\n.menu a:hover{background:rgba(255,255,255,.1)}\n.menu a[aria-current]{background:rgba(255,255,255,.13)}\n.menu a[aria-current]::after{content:\"\";position:absolute;left:50%;bottom:2px;width:16px;height:3px;margin-left:-8px;border-radius:2px;background:var(--gold-hi)}\n.menu img{width:20px;height:20px}\n.clock{position:absolute;right:16px;font-size:12px;line-height:1.25;text-align:right;color:#d8d3c2}\n/* inner pages */\n.scroll{flex:1;min-height:0;overflow:auto;padding:clamp(16px,3vw,28px)}\n.scroll h1{margin:0 0 4px;font-size:clamp(1.8rem,4vw,2.7rem);font-weight:400;letter-spacing:-.025em;line-height:1.05}\n.lead{margin:0 0 20px;color:#5c4d1d;font-size:.95rem}\n.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}\n.sec{background:rgba(255,255,255,.72);border:1px solid var(--line);border-radius:8px;padding:16px 18px}\n.sec.p{grid-row:span 2}\n.sec h2{display:flex;align-items:center;gap:10px;margin:0 0 8px;font-size:1.45rem}\n.sec h2::before{content:\"\";width:4px;height:1.1em;border-radius:2px;background:var(--gold)}\n.sec p{margin:0;max-width:60ch}\n.fields{display:grid;grid-template-columns:1fr 1fr;gap:0 16px;margin:0}\n.item{min-width:0;padding:8px 0;border-bottom:1px solid var(--line)}\n.item.wide{grid-column:span 2}\n.item dt{font-size:.72rem;font-weight:600;color:var(--gold-lo)}\n.item dd{margin:0;font-size:1.12rem;font-weight:500;overflow-wrap:anywhere}\n.btn{font:500 .8rem var(--m);padding:9px 16px;border:1px solid var(--black);border-radius:6px;background:var(--black);color:var(--gold-hi);cursor:pointer}\n.btn.ghost{background:#fff;color:var(--black)}\n.btn:hover{background:var(--gold);border-color:var(--gold);color:var(--black)}\n/* achievements */\n.bar{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px;margin-bottom:18px}\n.bar>div{flex:1;min-width:220px}.bar .lead{margin:0}\n.tools{display:none;gap:10px}.editing .tools{display:flex}\n.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}\n.tile{display:flex;flex-direction:column;padding:0;text-align:left;font:inherit;color:inherit;cursor:pointer;background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden;transition:transform .15s,box-shadow .15s,border-color .15s}\n.tile[aria-disabled]{cursor:default}\n.tile:hover{scale:1.05;z-index:5;border-color:var(--gold)}\n.tile span{display:block}\n.tile .im{aspect-ratio:1;display:grid;place-items:center;background:#f3efe3;color:#b5a265;font-size:1.5rem}\n.tile .im{position:relative}.tile .im img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}\n.tile .cap{padding:8px 10px;min-height:56px}\n.tile b{display:block;font-size:1.05rem;line-height:1.25}\n.tile small{font-weight:700;color:var(--gold-lo)}\n.tile.empty .cap{opacity:.45}\n.lb{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;gap:12px;padding:12px;background:rgba(5,5,4,.86);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}\n.lb.on{display:flex}\n.lb figure{margin:0;max-width:min(80vw,900px);background:var(--black);color:#fff;border:1px solid var(--gold-lo);border-radius:10px;overflow:hidden;animation:zoom .28s cubic-bezier(.2,.8,.2,1)}\n@keyframes zoom{from{opacity:0;transform:scale(.78)}}\n.lb img{display:block;m
